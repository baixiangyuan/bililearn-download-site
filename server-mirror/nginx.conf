# 下载站 nginx 配置
# 用法：ln -s /etc/dl-mirror/nginx.conf /etc/nginx/conf.d/download.conf && nginx -t && systemctl reload nginx

# 下载流量大，建议把日志级别调到 warn，必要时关掉 access_log
server {
    listen 80;
    listen [::]:80;
    server_name dl.example.com;

    # ---- 证书就位后取消注释，并删掉上面 80 监听块 ----
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/dl.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dl.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache   shared:SSL:10m;

    root /var/lib/dl-mirror;
    access_log /var/log/nginx/download-access.log;
    error_log  /var/log/nginx/download-error.log warn;

    # 安装包按内容命名可长期强缓存；manifest 必须短缓存，
    # 否则前端读到旧的版本列表。
    location /manifest.json {
        add_header Cache-Control "public, max-age=60, s-maxage=300";
        add_header Access-Control-Allow-Origin "*";
        try_files /manifest.json =404;
    }

    location /files/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        # 支持 Range，断点续传和大文件必备
        chunked_transfer_encoding on;

        location ~ \.part$ {
            deny all;
            return 404;
        }
    }

    # 顺手开放一个健康检查端点，供 uptime 监控用
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # 藏起服务器版本号
    server_tokens off;

    # 单连接带宽上限，避免个别下载占满出口
    # limit_rate_after 10m;
    # limit_rate 2m;

    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
}
